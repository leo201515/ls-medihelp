{% extends "base.html" %}

{% block title %}Settings - MediHelp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="text-center mb-5">
            <h1 class="mb-3">Settings</h1>
            <p class="text-muted">Customize the app to your needs</p>
        </div>

        <div class="card shadow-lg mb-4">
            <div class="card-body p-4 p-md-5">
                <div class="section-title mb-4">
                    <div class="icon-badge">🤖</div>
                    <h5 class="mb-0">AI Settings</h5>
                </div>

                <div class="mb-4">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="useAi" {% if use_ai %}checked{% endif %}>
                        <label class="form-check-label" for="useAi">
                            <strong>Enable AI Responses</strong>
                            <br><small class="text-muted">When enabled, an AI will be used for dynamic responses. Otherwise, the rule-based system will be used.</small>
                        </label>
                    </div>
                </div>

                <button class="btn btn-primary w-100" onclick="saveSettings()">Save Settings</button>
            </div>
        </div>

        <div class="card shadow-lg mb-4">
            <div class="card-body p-4 p-md-5">
                <div class="section-title mb-4">
                    <div class="icon-badge">📱</div>
                    <h5 class="mb-0">Download App</h5>
                </div>
                <p class="text-muted mb-3">Download the MediHelp Android app to use it offline.</p>
                <a href="/download-apk" class="btn btn-success w-100">
                    <span style="margin-right: 0.5rem;">⬇️</span>
                    Download APK
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function saveSettings() {
    const useAi = document.getElementById('useAi').checked;

    fetch('/save-settings', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            use_ai: useAi,
            language: 'en'
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            window.location.href = '/';
        }
    })
    .catch(error => {
        alert('Error saving settings');
    });
}
</script>
{% endblock %}
